<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: ui-serif, Georgia, "Songti SC", serif;
        color: #2b2925;
        background: #fbf7ee;
      }

      .sheet {
        min-height: 100vh;
        box-sizing: border-box;
        padding: 28px;
        border: 1px solid #d8ccbb;
        background:
          linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.16)),
          #f7efe0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <h1>HTML Node</h1>
      <p>This node is rendered in an isolated iframe. You can switch to source editing and write changes back to the original HTML file.</p>
    </main>
  </body>
</html>
